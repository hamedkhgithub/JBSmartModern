    compileSdk 35

    defaultConfig {
        applicationId "com.geniuskala.jbsmartmodern"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }
}

dependencies {
    // Newest known published Actions Semiconductor iBluz Android SDK.
